<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <title>Vignesh's Tea Kadai</title>
    <meta name="description" content="Vignesh — CS Student, Chennai. ML Engineer, Systems Builder, 3D Developer.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050203">
</head>
<body>

    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <canvas class="webgl"></canvas>
    <div class="fade-overlay"></div>

    <!-- Loading -->
    <div id="brewing">
        <div class="steam"></div><div class="steam"></div>
        <div class="steam"></div><div class="steam"></div>
        <div id="teacup-wrap">
            <div id="teacup">
                <div id="cup-body"></div>
                <div id="cup-handle"></div>
                <div id="cup-liquid"></div>
            </div>
            <div id="cup-saucer"></div>
        </div>
        <h1>Brewing your experience… <span id="progressPercentage">0</span>%</h1>
        <div id="brew-bar"><div id="brew-fill"></div></div>
        <p id="brew-sub">Warming the stove</p>
    </div>

    <button class="start-btn">☕ ENTER KADAI</button>

    <!-- Controls hint (shown after enter) -->
    <div id="controls-hint" class="controls-hint hidden">
        <span>🖱 Drag to look around</span>
        <span>🖱 Scroll to zoom</span>
        <span>👆 Click objects to explore</span>
    </div>

    <!-- Theme toggle -->
    <button id="theme-toggle" class="theme-toggle hidden" title="Toggle day / night">
        <span id="theme-icon">🌙</span>
    </button>

    <!-- Back button (shown when zoomed in) -->
    <button id="back-btn" class="back-btn hidden">← Back</button>

    <!-- Zone label (shown on hover) -->
    <div id="zone-label" class="zone-label hidden"></div>

    <!-- ══════════════════════════════════════════════
         DETAIL OVERLAY — appears when you click a zone
         ══════════════════════════════════════════════ -->
    <div id="detail-overlay" class="detail-overlay hidden">
        <button id="detail-close" class="detail-close">✕</button>
        <div id="detail-content" class="detail-content"></div>
    </div>

    <!-- Individual project panels (generated by JS) -->

    <!-- Keyboard hints -->
    <div id="kbd" class="kbd hidden">
        <span><kbd>ESC</kbd> back</span>
        <span><kbd>T</kbd> day/night</span>
        <span><kbd>R</kbd> reset view</span>
    </div>

</body>
</html>
